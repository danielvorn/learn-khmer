<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>អក្សរខ្មែរ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Khmer:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e;
  --surface: #181818;
  --border: #2a2a2a;
  --accent: #c8a96e;
  --accent-dim: rgba(200,169,110,0.12);
  --text: #e8e0d0;
  --muted: #666;
  --series1: #6a9fd8;
  --series2: #d87a6a;
  --correct: #5a9e6f;
  --correct-dim: rgba(90,158,111,0.15);
  --wrong: #9e5a5a;
  --wrong-dim: rgba(158,90,90,0.15);
  --sidebar-w: 180px;
  --bottom-h: 60px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

.app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: #0a0a0a;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 10;
}

.sidebar-brand {
  padding: 28px 20px 24px;
  border-bottom: 1px solid var(--border);
}

.sidebar-brand h1 {
  font-family: 'Noto Serif Khmer', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}

.sidebar-brand p {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--accent);
  text-transform: uppercase;
  margin-top: 6px;
}

.sidebar-nav { padding: 16px 0; flex: 1; }

.nav-section { margin-bottom: 8px; }

.nav-section-label {
  font-size: 8px;
  letter-spacing: 0.25em;
  color: #333;
  text-transform: uppercase;
  padding: 0 20px;
  margin-bottom: 4px;
  margin-top: 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
  user-select: none;
}

.nav-item:hover { background: #141414; }
.nav-item.active { background: rgba(200,169,110,0.08); }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.nav-icon { width: 15px; height: 15px; flex-shrink: 0; color: #3a3a3a; transition: color 0.15s; }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-item:hover .nav-icon { color: #555; }
.nav-label { font-size: 11px; letter-spacing: 0.1em; color: #3a3a3a; transition: color 0.15s; }
.nav-item.active .nav-label { color: var(--accent); }
.nav-item:hover .nav-label { color: var(--muted); }

.learn-subtoggle {
  display: flex;
  margin: 6px 12px 12px;
  background: #111;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #1e1e1e;
}

.learn-sub-btn {
  flex: 1;
  padding: 8px 0;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: center;
  color: #333;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  font-family: 'DM Mono', monospace;
  border: none;
  background: none;
}

.learn-sub-btn.active { background: rgba(200,169,110,0.12); color: var(--accent); }

/* MAIN */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  padding: 48px 40px 80px;
}

.panel { display: none; }
.panel.active { display: block; }

/* BOTTOM NAV */
.bottom-nav { display: none; }

/* PRACTICE TOOLBAR */
.practice-toolbar { display: flex; align-items: center; margin-bottom: 16px; }

.series-legend { display: flex; align-items: center; gap: 20px; font-size: 10px; letter-spacing: 0.15em; }
.series-legend .s1 { color: var(--series1); }
.series-legend .s2 { color: var(--series2); }
.legend-divider { color: #333; user-select: none; }
.legend-toggle {
  cursor: pointer; color: var(--muted); letter-spacing: 0.15em;
  text-decoration: line-through; text-decoration-color: transparent;
  transition: color 0.2s, text-decoration-color 0.2s;
}
.legend-toggle:hover { color: var(--text); }
.legend-toggle.active { color: var(--accent); text-decoration-color: var(--accent); }

/* GRIDS */
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  padding: 20px 12px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  animation: fadeUp 0.4s ease both;
}

.card:hover { border-color: rgba(200,169,110,0.4); background: #1e1e1e; }
.card:active { transform: scale(0.97); }
.card.playing { border-color: var(--accent); background: var(--accent-dim); }
.card[data-series="1"] .khmer { color: var(--series1); }
.card[data-series="2"] .khmer { color: var(--series2); }
.card.playing .khmer { color: var(--accent) !important; }

.ripple-el {
  position: absolute; border-radius: 50%;
  background: rgba(200,169,110,0.3);
  transform: scale(0);
  animation: ripple 0.5s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

.khmer { font-family: 'Noto Serif Khmer', serif; font-size: 52px; line-height: 1; color: var(--text); transition: color 0.2s; }
.index { position: absolute; top: 6px; right: 8px; font-size: 8px; color: #333; }

.wave { display: flex; align-items: center; gap: 2px; height: 14px; opacity: 0; transition: opacity 0.2s; }
.card.playing .wave { opacity: 1; }
.wave span { display: block; width: 2px; background: var(--accent); border-radius: 2px; animation: bar 0.6s ease-in-out infinite alternate; }
.wave span:nth-child(1) { height: 4px;  animation-delay: 0s; }
.wave span:nth-child(2) { height: 10px; animation-delay: 0.1s; }
.wave span:nth-child(3) { height: 7px;  animation-delay: 0.2s; }
.wave span:nth-child(4) { height: 12px; animation-delay: 0.05s; }
.wave span:nth-child(5) { height: 5px;  animation-delay: 0.15s; }

@keyframes bar { from { transform: scaleY(0.4); } to { transform: scaleY(1.4); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

#grid-subs .card { padding-bottom: 32px; }
#grid-subs .wave { transform: translateY(16px); }

/* QUIZ */
.quiz-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.score-bar { display: flex; gap: 24px; font-size: 11px; letter-spacing: 0.15em; color: var(--muted); }
.score-bar span { color: var(--text); }
#q-correct { color: var(--correct); }
#q-wrong { color: var(--wrong); }
.progress-track { width: 100%; max-width: 400px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

.play-btn {
  width: 80px; height: 80px; border-radius: 50%;
  border: 1px solid var(--accent); background: var(--accent-dim);
  color: var(--accent); font-size: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.15s;
}
.play-btn:hover { background: rgba(200,169,110,0.2); }
.play-btn:active { transform: scale(0.95); }
.play-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.play-btn.pulse { animation: btnpulse 0.5s ease; }
@keyframes btnpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.91); } }

.play-hint { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; margin-top: -16px; }

.options-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 700px; }
.opt-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: 'Noto Serif Khmer', serif; font-size: 32px;
  padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 4px; transition: border-color 0.15s, background 0.15s, transform 0.1s; user-select: none;
}
.opt-btn:hover:not(:disabled) { border-color: rgba(200,169,110,0.4); background: #1e1e1e; }
.opt-btn:active:not(:disabled) { transform: scale(0.97); }
.opt-btn:disabled { cursor: default; }
.opt-btn.correct { border-color: var(--correct); background: var(--correct-dim); color: var(--correct); }
.opt-btn.wrong { border-color: var(--wrong); background: var(--wrong-dim); color: var(--wrong); }

.feedback { font-size: 11px; letter-spacing: 0.12em; min-height: 16px; }
.feedback.correct { color: var(--correct); }
.feedback.wrong { color: var(--wrong); }

.next-btn {
  background: none; border: 1px solid var(--accent); color: var(--accent);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.25em;
  text-transform: uppercase; padding: 10px 32px; border-radius: 4px; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity 0.3s, background 0.2s;
}
.next-btn.visible { opacity: 1; pointer-events: auto; }
.next-btn:hover { background: var(--accent-dim); }

.results { display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.results.show { display: flex; }
.results-score { font-family: 'Noto Serif Khmer', serif; font-size: 72px; color: var(--accent); line-height: 1; }
.results-label { font-size: 10px; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; }
.results-detail { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.restart-btn {
  background: none; border: 1px solid var(--accent); color: var(--accent);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.25em;
  text-transform: uppercase; padding: 10px 32px; border-radius: 4px; cursor: pointer;
  margin-top: 8px; transition: background 0.2s;
}
.restart-btn:hover { background: var(--accent-dim); }

/* LISTEN */
.listen-top-bar { height: 2px; width: 0%; background: var(--accent); border-radius: 0 2px 2px 0; margin-bottom: 28px; }
.listen-top-bar.loading { animation: topbar 1.4s ease-in-out infinite; }
@keyframes topbar { 0% { width:0%; margin-left:0%; } 50% { width:70%; margin-left:15%; } 100% { width:0%; margin-left:100%; } }

.listen-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; padding-top: 20px; }
.listen-hint { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

.listen-transcription { min-height: 60px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; width: 100%; max-width: 500px; }
.listen-card { display: none; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px 48px 20px 20px; position: relative; animation: fadeUp 0.3s ease both; }
.listen-card.visible { display: block; }
.listen-transcription-text { font-family: 'Noto Serif Khmer', serif; font-size: 24px; line-height: 1.7; color: var(--text); display: block; text-align: left; }
.listen-copy-btn { position: absolute; top: 12px; right: 12px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; }
.listen-copy-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
.listen-copy-btn.copied { color: var(--correct); border-color: var(--correct); }
.listen-reveal { display: none; }
.listen-error { font-size: 10px; color: var(--wrong); letter-spacing: 0.1em; min-height: 16px; }
.listen-next { background: none; border: 1px solid var(--accent); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 32px; border-radius: 4px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s, background 0.2s; }
.listen-next.visible { opacity: 1; pointer-events: auto; }
.listen-next:hover { background: var(--accent-dim); }

/* DICTIONARY */
.dict-search-wrap { position: relative; margin-bottom: 20px; }
.dict-search { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 36px 10px 14px; font-family: 'Noto Serif Khmer', serif; font-size: 16px; color: var(--text); outline: none; transition: border-color 0.2s; box-sizing: border-box; }
.dict-search::placeholder { color: var(--muted); font-size: 14px; font-family: 'DM Mono', monospace; }
.dict-search:focus { border-color: var(--accent); }
.dict-search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.dict-section-label { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
.dict-consonant-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
.dict-con-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none; }
.dict-con-card:hover { border-color: rgba(200,169,110,0.4); background: #1e1e1e; }
.dict-con-card.active { border-color: var(--accent); background: var(--accent-dim); }
.dict-con-card .khmer { font-size: 28px; transition: color 0.15s; }
.dict-con-card[data-series="1"] .khmer { color: var(--series1); }
.dict-con-card[data-series="2"] .khmer { color: var(--series2); }
.dict-con-card.active .khmer { color: var(--accent); }
.dict-results { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: none; }
.dict-results.visible { display: block; }
.dict-results-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.dict-results-glyph { font-family: 'Noto Serif Khmer', serif; font-size: 28px; color: var(--accent); line-height: 1; }
.dict-results-count { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.dict-entry { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; position: relative; }
.dict-entry:last-child { border-bottom: none; }
.dict-entry-word { font-family: 'Noto Serif Khmer', serif; font-size: 20px; color: var(--text); min-width: 80px; line-height: 1.3; }
.dict-entry-right { flex: 1; padding-right: 32px; }
.dict-entry-pos { font-size: 9px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
.dict-entry-def { font-family: 'Noto Serif Khmer', serif; font-size: 13px; color: var(--muted); line-height: 1.6; }
.dict-copy-btn { position: absolute; top: 14px; right: 14px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; }
.dict-copy-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
.dict-copy-btn.copied { color: var(--correct); border-color: var(--correct); }
.dict-show-more { padding: 12px 16px; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-align: center; text-transform: uppercase; cursor: pointer; border-top: 1px solid var(--border); transition: color 0.2s; }
.dict-show-more:hover { color: var(--accent); }
.dict-loading { font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-align: center; padding: 20px 0; display: none; }
.dict-loading.visible { display: block; }

/* VOWELS */
.vowel-filter { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
.vowel-filter-btn { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); cursor: pointer; padding-bottom: 4px; border: none; border-bottom: 1px solid transparent; background: none; font-family: 'DM Mono', monospace; transition: color 0.2s, border-color 0.2s; }
.vowel-filter-btn:hover { color: var(--text); }
.vowel-filter-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

.vowel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.vowel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fadeUp 0.3s ease both; }
.vowel-glyph { font-family: 'Noto Serif Khmer', serif; font-size: 44px; line-height: 1; color: var(--text); }
.vowel-btns { display: flex; gap: 6px; width: 100%; }
.vowel-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 4px; border-radius: 5px; border: 1px solid var(--border); background: none; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; font-family: 'DM Mono', monospace; user-select: none; }
.vowel-btn:active { transform: scale(0.96); }
.vowel-btn.s1 { border-color: rgba(106,159,216,0.4); }
.vowel-btn.s1:hover, .vowel-btn.s1.playing { background: rgba(106,159,216,0.1); border-color: var(--series1); }
.vowel-btn.s2 { border-color: rgba(216,122,106,0.4); }
.vowel-btn.s2:hover, .vowel-btn.s2.playing { background: rgba(216,122,106,0.1); border-color: var(--series2); }
.vowel-btn.same { border-color: rgba(200,169,110,0.4); }
.vowel-btn.same:hover, .vowel-btn.same.playing { background: var(--accent-dim); border-color: var(--accent); }
.vowel-btn-label { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; }
.vowel-btn.s1 .vowel-btn-label { color: var(--series1); }
.vowel-btn.s2 .vowel-btn-label { color: var(--series2); }
.vowel-btn.same .vowel-btn-label { color: var(--accent); }
.vowel-btn-play { font-size: 10px; color: var(--muted); }
.vowel-btn.playing .vowel-btn-play { color: var(--text); }
.vowel-card.hidden { display: none; }

/* MOBILE */
@media (max-width: 700px) {
  .sidebar { display: none; }

  .main {
    margin-left: 0;
    padding: 24px 16px calc(var(--bottom-h) + 24px);
    max-width: 100%;
  }

  .bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--bottom-h);
    background: #0a0a0a;
    border-top: 1px solid var(--border);
    z-index: 10;
    justify-content: space-around;
    align-items: center;
  }

  .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; padding: 8px 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  .bottom-nav-icon { width: 20px; height: 20px; color: #3a3a3a; transition: color 0.15s; }
  .bottom-nav-item.active .bottom-nav-icon { color: var(--accent); }
  .bottom-nav-label { font-size: 8px; letter-spacing: 0.06em; color: #3a3a3a; transition: color 0.15s; text-transform: uppercase; }
  .bottom-nav-item.active .bottom-nav-label { color: var(--accent); }

  .mobile-learn-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .mobile-learn-btn { flex: 1; padding: 8px 0; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; color: var(--muted); cursor: pointer; background: none; border: none; font-family: 'DM Mono', monospace; transition: background 0.15s, color 0.15s; }
  .mobile-learn-btn.active { background: var(--accent-dim); color: var(--accent); }

  .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .card { padding: 14px 6px 12px; gap: 6px; }
  .khmer { font-size: 36px; }
  #grid-subs .card { padding-bottom: 24px; }
  .series-legend { gap: 14px; flex-wrap: wrap; font-size: 9px; }
  .options-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .opt-btn { font-size: 24px; padding: 10px 4px; }
  .play-btn { width: 64px; height: 64px; font-size: 22px; }
  .quiz-wrap { gap: 20px; }
  .results-score { font-size: 56px; }
  .vowel-grid { grid-template-columns: repeat(2, 1fr); }
  .dict-consonant-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <h1>អក្សរខ្មែរ</h1>
      <p>Khmer Script</p>
    </div>
    <div class="sidebar-nav">

<script>
// ── DATA ──
const consonants = [
  { khmer: 'ក', roman: 'ka',   series: 1, sub: '្ក' },
  { khmer: 'ខ', roman: 'kha',  series: 1, sub: '្ខ' },
  { khmer: 'គ', roman: 'ko',   series: 2, sub: '្គ' },
  { khmer: 'ឃ', roman: 'kho',  series: 2, sub: '្ឃ' },
  { khmer: 'ង', roman: 'ngo',  series: 2, sub: '្ង' },
  { khmer: 'ច', roman: 'cha',  series: 1, sub: '្ច' },
  { khmer: 'ឆ', roman: 'chha', series: 1, sub: '្ឆ' },
  { khmer: 'ជ', roman: 'cho',  series: 2, sub: '្ជ' },
  { khmer: 'ឈ', roman: 'chho', series: 2, sub: '្ឈ' },
  { khmer: 'ញ', roman: 'nyo',  series: 2, sub: '្ញ' },
  { khmer: 'ដ', roman: 'da',   series: 1, sub: '្ដ' },
  { khmer: 'ឋ', roman: 'tha',  series: 1, sub: '្ឋ' },
  { khmer: 'ឌ', roman: 'do',   series: 2, sub: '្ឌ' },
  { khmer: 'ឍ', roman: 'tho',  series: 2, sub: '្ឍ' },
  { khmer: 'ណ', roman: 'na',   series: 1, sub: '្ណ' },
  { khmer: 'ត', roman: 'ta',   series: 1, sub: '្ត' },
  { khmer: 'ថ', roman: 'tha',  series: 1, sub: '្ថ' },
  { khmer: 'ទ', roman: 'to',   series: 2, sub: '្ទ' },
  { khmer: 'ធ', roman: 'tho',  series: 2, sub: '្ធ' },
  { khmer: 'ន', roman: 'no',   series: 2, sub: '្ន' },
  { khmer: 'ប', roman: 'ba',   series: 1, sub: '្ប' },
  { khmer: 'ផ', roman: 'pha',  series: 1, sub: '្ផ' },
  { khmer: 'ព', roman: 'po',   series: 2, sub: '្ព' },
  { khmer: 'ភ', roman: 'pho',  series: 2, sub: '្ភ' },

  { khmer: 'យ', roman: 'yo',   series: 2, sub: '្យ' },
  { khmer: 'រ', roman: 'ro',   series: 2, sub: '្រ' },
  { khmer: 'ល', roman: 'lo',   series: 2, sub: '្ល' },
  { khmer: 'វ', roman: 'vo',   series: 2, sub: '្វ' },
  { khmer: 'ស', roman: 'sa',   series: 1, sub: '្ស' },
  { khmer: 'ហ', roman: 'ha',   series: 1, sub: '្ហ' },
  { khmer: 'ឡ', roman: 'la',   series: 1, sub: null },
  { khmer: 'អ', roman: 'a',    series: 1, sub: '្អ' },

const vowels = [
  { glyph: 'ា',  num: 1,  same: false },
  { glyph: 'ិ',  num: 2,  same: false },
  { glyph: 'ី',  num: 3,  same: false },
  { glyph: 'ឹ',  num: 4,  same: true  },
  { glyph: 'ឺ',  num: 5,  same: false },
  { glyph: 'ុ',  num: 6,  same: false },
  { glyph: 'ូ',  num: 7,  same: false },
  { glyph: 'ួ',  num: 8,  same: true  },
  { glyph: 'ើ',  num: 9,  same: false },
  { glyph: 'ឿ',  num: 10, same: true  },
  { glyph: 'ៀ',  num: 11, same: true  },
  { glyph: 'េ',  num: 12, same: true  },
  { glyph: 'ែ',  num: 13, same: false },
  { glyph: 'ៃ',  num: 14, same: false },
  { glyph: 'ោ',  num: 15, same: false },
  { glyph: 'ៅ',  num: 16, same: false },
  { glyph: 'ុំ', num: 17, same: false },
  { glyph: 'ំ',  num: 18, same: false },
  { glyph: 'ាំ', num: 19, same: false },
  { glyph: 'ះ',  num: 20, same: false },
  { glyph: 'ុះ', num: 21, same: false },
  { glyph: 'េះ', num: 22, same: false },

];

// ── NAV ──
function switchSection(name, el, isMobile) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');

  if (isMobile) {
    document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));
    const mlt = document.getElementById('mobile-learn-toggle');
    if (mlt) mlt.style.display = name === 'learn' ? 'flex' : 'none';
  } else {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  }
  el.classList.add('active');

  if (name === 'quiz') startQuiz();
  if (name === 'dictionary') initDictionary();
}

function switchLearn(sub, el) {
  document.querySelectorAll('.learn-sub-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('learn-consonants').style.display = sub === 'consonants' ? 'block' : 'none';
  document.getElementById('learn-vowels').style.display = sub === 'vowels' ? 'block' : 'none';
}

function switchLearnMobile(sub, el) {
  document.querySelectorAll('.mobile-learn-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('learn-consonants').style.display = sub === 'consonants' ? 'block' : 'none';
  document.getElementById('learn-vowels').style.display = sub === 'vowels' ? 'block' : 'none';
}

// show mobile toggle on mobile
if (window.innerWidth <= 700) {
  document.getElementById('mobile-learn-toggle').style.display = 'flex';
}

// ── CONSONANTS ──
const grid = document.getElementById('grid');
let currentAudio = null, currentCard = null;

consonants.forEach((c, i) => {
  const num = String(i + 1).padStart(2, '0');
  const file = `audio/c-${num}.wav`;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.series = c.series;
  card.style.animationDelay = `${i * 0.025}s`;
  card.innerHTML = `<span class="index">${num}</span><span class="khmer">${c.khmer}</span><div class="wave"><span></span><span></span><span></span><span></span><span></span></div>`;
  card.addEventListener('click', (e) => {
    const rect = card.getBoundingClientRect();
    const rip = document.createElement('div');
    rip.className = 'ripple-el';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    card.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    if (currentCard) currentCard.classList.remove('playing');
    const audio = new Audio(file);
    currentAudio = audio; currentCard = card;
    card.classList.add('playing');
    audio.play().catch(() => card.classList.remove('playing'));
    audio.addEventListener('ended', () => card.classList.remove('playing'));
  });
  grid.appendChild(card);
});

// subscript grid
const gridSubs = document.getElementById('grid-subs');
consonants.forEach((c, i) => {
  if (!c.sub) return;
  const num = String(i + 1).padStart(2, '0');
  const file = `audio/c-${num}.wav`;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.series = c.series;
  card.style.animationDelay = `${i * 0.025}s`;
  card.innerHTML = `<span class="index">${num}</span><span class="khmer">${c.sub}</span><div class="wave"><span></span><span></span><span></span><span></span><span></span></div>`;
  card.addEventListener('click', (e) => {
    const rect = card.getBoundingClientRect();
    const rip = document.createElement('div');
    rip.className = 'ripple-el';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    card.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    if (currentCard) currentCard.classList.remove('playing');
    const audio = new Audio(file);
    currentAudio = audio; currentCard = card;
    card.classList.add('playing');
    audio.play().catch(() => card.classList.remove('playing'));
    audio.addEventListener('ended', () => card.classList.remove('playing'));
  });
  gridSubs.appendChild(card);
});

function toggleSubs() {
  const baseGrid = document.getElementById('grid');
  const subGrid = document.getElementById('grid-subs');
  const btn = document.getElementById('sub-toggle');
  const showingSubs = subGrid.style.display !== 'none';
  baseGrid.style.display = showingSubs ? 'grid' : 'none';
  subGrid.style.display = showingSubs ? 'none' : 'grid';
  btn.classList.toggle('active', !showingSubs);
}

function toggleScramble() {
  const btn = document.getElementById('scramble-toggle');
  const isScrambled = btn.classList.toggle('active');
  [document.getElementById('grid'), document.getElementById('grid-subs')].forEach(g => {
    const cards = [...g.children];
    if (isScrambled) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
    } else {
      cards.sort((a, b) => parseInt(a.querySelector('.index')?.textContent||0) - parseInt(b.querySelector('.index')?.textContent||0));
    }
    cards.forEach(c => g.appendChild(c));
  });
}

// ── VOWELS ──
let vowelAudio = null, vowelPlayingBtn = null;

(function initVowels() {
  const vgrid = document.getElementById('vowel-grid');
  vowels.forEach((v, i) => {
    const num = String(v.num).padStart(2, '0');
    const card = document.createElement('div');
    card.className = 'vowel-card';
    card.dataset.same = v.same;
    card.dataset.num = v.num;
    card.style.animationDelay = `${i * 0.03}s`;
    if (v.same) {
      card.innerHTML = `<span class="vowel-glyph">${v.glyph}</span><div class="vowel-btns"><button class="vowel-btn same" data-file="audio/vowels/v1-${num}.wav"><span class="vowel-btn-label">Same in both</span><span class="vowel-btn-play">▶</span></button></div>`;
    } else {
      card.innerHTML = `<span class="vowel-glyph">${v.glyph}</span><div class="vowel-btns"><button class="vowel-btn s1" data-file="audio/vowels/v1-${num}.wav"><span class="vowel-btn-label">Series 1</span><span class="vowel-btn-play">▶</span></button><button class="vowel-btn s2" data-file="audio/vowels/v2-${num}.wav"><span class="vowel-btn-label">Series 2</span><span class="vowel-btn-play">▶</span></button></div>`;
    }
    card.querySelectorAll('.vowel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (vowelAudio) { vowelAudio.pause(); vowelAudio.currentTime = 0; }
        if (vowelPlayingBtn) vowelPlayingBtn.classList.remove('playing');
        vowelAudio = new Audio(btn.dataset.file);
        vowelPlayingBtn = btn;
        btn.classList.add('playing');
        vowelAudio.play().catch(() => {});
        vowelAudio.addEventListener('ended', () => btn.classList.remove('playing'));
      });
    });
    vgrid.appendChild(card);
  });
})();

function scrambleVowels(btn) {
  const vgrid = document.getElementById('vowel-grid');
  const isScrambled = btn.classList.toggle('active');
  const cards = [...vgrid.children];
  if (isScrambled) {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
  } else {
    cards.sort((a, b) => parseInt(a.dataset.num) - parseInt(b.dataset.num));
  }
  cards.forEach(c => vgrid.appendChild(c));
}

function filterVowels(filter, el) {
  document.querySelectorAll('.vowel-filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.vowel-card').forEach(card => {
    const isSame = card.dataset.same === 'true';
    if (filter === 'all') card.classList.remove('hidden');
    else if (filter === 'same') card.classList.toggle('hidden', !isSame);
    else if (filter === 'different') card.classList.toggle('hidden', isSame);
  });
}

// ── LISTEN ──
let listenAudio = null, currentListenUrl = null, listenCache = [], isFetchingCache = false;

async function prefetchListenCache() {
  if (isFetchingCache || listenCache.length > 20) return;
  isFetchingCache = true;
  try {
    const offset = Math.floor(Math.random() * 14843);
    const res = await fetch(`https://datasets-server.huggingface.co/rows?dataset=seanghay/km-speech-corpus&config=default&split=train&offset=${offset}&length=100`);
    const data = await res.json();
    if (!res.ok) throw new Error('API error');
    listenCache.push(...data.rows.map(r => ({ audioUrl: r.row.audio[0].src, transcription: r.row.transcription })));
  } catch (e) {}
  isFetchingCache = false;
}

prefetchListenCache();

function replayListen() {
  if (!currentListenUrl) { fetchAndPlay(); return; }
  if (listenAudio) { listenAudio.pause(); listenAudio.currentTime = 0; }
  listenAudio = new Audio(currentListenUrl);
  listenAudio.play().catch(() => {});
  document.getElementById('listen-play-btn').classList.add('pulse');
}

async function fetchAndPlay() {
  const btn = document.getElementById('listen-play-btn');
  const hint = document.getElementById('listen-hint');
  const error = document.getElementById('listen-error');
  const text = document.getElementById('listen-transcription-text');
  const next = document.getElementById('listen-next');
  const bar = document.getElementById('listen-top-bar');

  document.getElementById('listen-card').classList.remove('visible');
  next.classList.remove('visible');
  error.textContent = '';
  hint.textContent = 'loading…';
  btn.disabled = true;
  bar.classList.add('loading');
  if (listenAudio) { listenAudio.pause(); listenAudio = null; }

  if (listenCache.length === 0) {
    await prefetchListenCache();
    while (isFetchingCache) await new Promise(r => setTimeout(r, 100));
  }

  if (listenCache.length === 0) {
    hint.textContent = 'tap play to hear a random sentence';
    error.textContent = 'failed to load — check your connection';
    btn.disabled = false;
    bar.classList.remove('loading');
    return;
  }

  const item = listenCache.shift();
  currentListenUrl = item.audioUrl;
  text.textContent = item.transcription;
  document.getElementById('listen-card').classList.add('visible');
  hint.textContent = 'tap to replay';
  listenAudio = new Audio(item.audioUrl);
  listenAudio.play().catch(() => { error.textContent = 'could not play audio'; });
  next.classList.add('visible');
  btn.disabled = false;
  bar.classList.remove('loading');
  if (listenCache.length < 20) prefetchListenCache();
}

function copyTranscription() {
  const text = document.getElementById('listen-transcription-text').textContent;
  const btn = document.getElementById('listen-copy-btn');
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    }, 2000);
  });
}

// ── QUIZ ──
let quizQueue = [], currentQ = 0, correctCount = 0, wrongCount = 0, answered = false, quizAudio = null, currentFile = '';

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  quizQueue = shuffle(consonants.map((c, i) => ({ ...c, index: i })));
  currentQ = 0; correctCount = 0; wrongCount = 0;
  document.getElementById('quiz-results').classList.remove('show');
  document.getElementById('quiz-active').style.display = 'flex';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = quizQueue[currentQ];
  const num = String(q.index + 1).padStart(2, '0');
  currentFile = `audio/c-${num}.wav`;

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('q-num').textContent = currentQ + 1;
  document.getElementById('q-total').textContent = quizQueue.length;
  document.getElementById('q-correct').textContent = correctCount;
  document.getElementById('q-wrong').textContent = wrongCount;
  document.getElementById('q-progress').style.width = (currentQ / quizQueue.length * 100) + '%';
  document.getElementById('play-btn').onclick = () => playQuizAudio(currentFile);
  playQuizAudio(currentFile);

  const options = shuffle(consonants.map((c, i) => ({ ...c, index: i })));
  const og = document.getElementById('options-grid');
  og.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.khmer = opt.khmer;
    btn.innerHTML = opt.khmer;
    btn.addEventListener('click', () => handleAnswer(btn, opt, q));
    og.appendChild(btn);
  });
}

function playQuizAudio(file) {
  if (quizAudio) { quizAudio.pause(); quizAudio.currentTime = 0; }
  quizAudio = new Audio(file);
  quizAudio.play().catch(() => {});
  const btn = document.getElementById('play-btn');
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');
}

function handleAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  const isCorrect = chosen.khmer === correct.khmer;
  const fb = document.getElementById('feedback');
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.khmer === correct.khmer) b.classList.add('correct');
  });
  if (isCorrect) {
    correctCount++;
    fb.textContent = '✓ correct';
    fb.className = 'feedback correct';
  } else {
    wrongCount++;
    btn.classList.remove('correct');
    btn.classList.add('wrong');
    fb.textContent = `✗  the answer was ${correct.khmer}`;
    fb.className = 'feedback wrong';
  }
  document.getElementById('q-correct').textContent = correctCount;
  document.getElementById('q-wrong').textContent = wrongCount;
  setTimeout(() => nextQuestion(), isCorrect ? 800 : 1600);
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= quizQueue.length) {
    document.getElementById('quiz-active').style.display = 'none';
    document.getElementById('quiz-results').classList.add('show');
    const pct = Math.round(correctCount / quizQueue.length * 100);
    document.getElementById('res-score').textContent = pct + '%';
    document.getElementById('res-detail').textContent = `${correctCount} correct · ${wrongCount} wrong · ${quizQueue.length} total`;
  } else {
    loadQuestion();
  }
}

// ── DICTIONARY ──
let dictData = null, dictInited = false, dictCurrentPage = 0, dictCurrentEntries = [];
const DICT_PAGE_SIZE = 30;
const COPY_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

async function initDictionary() {
  if (dictInited) return;
  dictInited = true;
  const loading = document.getElementById('dict-loading');
  loading.classList.add('visible');
  try {
    const res = await fetch('dictionary.json');
    dictData = await res.json();
  } catch (e) {
    loading.textContent = 'failed to load dictionary';
    return;
  }
  loading.classList.remove('visible');
  const dgrid = document.getElementById('dict-consonant-grid');
  dgrid.innerHTML = '';
  consonants.forEach(c => {
    const card = document.createElement('div');
    card.className = 'dict-con-card';
    card.dataset.series = c.series;
    card.innerHTML = `<span class="khmer">${c.khmer}</span>`;
    card.addEventListener('click', () => {
      document.querySelectorAll('.dict-con-card').forEach(el => el.classList.remove('active'));
      card.classList.add('active');
      document.getElementById('dict-search').value = '';
      showDictResults(c.khmer, dictData.filter(e => e.w.startsWith(c.khmer)));
    });
    dgrid.appendChild(card);
  });
}

function showDictResults(label, entries, isSearch) {
  dictCurrentEntries = entries;
  dictCurrentPage = 0;
  const results = document.getElementById('dict-results');
  results.innerHTML = `<div class="dict-results-header"><span class="dict-results-glyph">${isSearch ? '🔍' : label}</span><span class="dict-results-count">${entries.length.toLocaleString()} result${entries.length !== 1 ? 's' : ''}</span></div>`;
  results.classList.add('visible');
  appendDictEntries();
}

function appendDictEntries() {
  const results = document.getElementById('dict-results');
  const existing = results.querySelector('.dict-show-more');
  if (existing) existing.remove();
  dictCurrentEntries.slice(dictCurrentPage * DICT_PAGE_SIZE, (dictCurrentPage + 1) * DICT_PAGE_SIZE).forEach(entry => {
    const div = document.createElement('div');
    div.className = 'dict-entry';
    div.innerHTML = `<span class="dict-entry-word">${entry.w}</span><div class="dict-entry-right"><div class="dict-entry-pos">${entry.p}</div><div class="dict-entry-def">${entry.d}</div></div><button class="dict-copy-btn">${COPY_SVG}</button>`;
    div.querySelector('.dict-copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(entry.w).then(() => {
        const btn = div.querySelector('.dict-copy-btn');
        btn.classList.add('copied'); btn.innerHTML = CHECK_SVG;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = COPY_SVG; }, 2000);
      });
    });
    results.appendChild(div);
  });
  dictCurrentPage++;
  if (dictCurrentPage * DICT_PAGE_SIZE < dictCurrentEntries.length) {
    const more = document.createElement('div');
    more.className = 'dict-show-more';
    more.textContent = `show more (${dictCurrentEntries.length - dictCurrentPage * DICT_PAGE_SIZE} remaining)`;
    more.addEventListener('click', appendDictEntries);
    results.appendChild(more);
  }
}

function onDictSearch(val) {
  if (!dictData) return;
  document.querySelectorAll('.dict-con-card').forEach(el => el.classList.remove('active'));
  const results = document.getElementById('dict-results');
  if (!val.trim()) { results.classList.remove('visible'); return; }
  showDictResults(val.trim(), dictData.filter(e => e.w.includes(val.trim())), true);
}
</script>
